# Every module the K3.1 manifests launch that kern's kernel index does not hold.
# `scripts/build.py` compiles each from `source` with the named `flags` and `includes` sets (none
# when unnamed) and `defines`, or copies `prebuilt`, and checks it against `sha256`.

[toolchain]
nvcc = "13.0.88"
arch = "sm_103a"

# Git submodules under third_party/ (their CUTLASS submodules at `cutlass`), MIT-licensed by DeepSeek.
[upstreams.DeepGEMM]
url = "https://github.com/deepseek-ai/DeepGEMM"
commit = "5081f8513af57e61696de4f4f04b0e707ffb503e"
cutlass = "f3fde58372d33e9a5650ba7b80fc48b3b49d40c8"

[flags]
plain = ["-std=c++17", "-O3"]
deepgemm = ["-std=c++20", "-O3", "--expt-relaxed-constexpr", "-DDG_NO_TORCH", "-diag-suppress", "20012,177"]

[includes]
deepgemm = ["source/deepgemm-k31", "third_party/DeepGEMM/deep_gemm/include", "third_party/DeepGEMM/third-party/cutlass/include"]

# K3.1's indexer as vLLM runs it on SM100: DeepGEMM's MQA logits (32 heads of 128, bf16 out), P's over
# the gathered key stream, D's over the paged cache, and a top-2048 over bf16 rows.
[kernels."k31_mqa_logits"]
sha256 = "b2caebce3c2b82fb553aa0cd883c9c2c5d28291235579dc2b0edbc565842c7d5"
source = "source/k31_mqa_logits.cu"
flags = "deepgemm"
includes = ["deepgemm"]

[kernels."k31_paged_mqa_logits"]
sha256 = "39b444c6ec14b9514ca496b8decd98ff84bdd85ef1bd9ba18523236e2baa3a21"
source = "source/k31_paged_mqa_logits.cu"
flags = "deepgemm"
includes = ["deepgemm"]

# K3.1's DSA glue: the indexer key into its cache, the query and head weights, the key stream the
# MQA logits read, the top-k as cache slots. Ours, after vLLM's K3.1 math.
[kernels."k31_dsa"]
sha256 = "ebc307230acfddf7ab687214847d3c7731ffa39b5217edeabd8d4dd019f5b9ed"
source = "source/k31_dsa.cu"
flags = "plain"

# D's candidate exchange with a candidate in one word, for a member of fewer than 65534 positions.
